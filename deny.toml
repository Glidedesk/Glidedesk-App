# cargo-deny: known vulnerabilities, licences compatible with MIT OR Apache-2.0,
# and dependencies only from crates.io. Run: `docker/run.sh cargo deny check`
# (CI runs it on every push and pull request, and weekly for new advisories).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices only for our direct dependencies; transitive ones (Tauri,
# GTK) are tracked upstream. Vulnerabilities fail for every crate.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates depend on each other by path (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
