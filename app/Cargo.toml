[package]
name = "glidedesk-app"
description = "Glidedesk tray and settings app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "glidedesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glidedesk-agent = { path = "../crates/agent" }
glidedesk-config.workspace = true
glidedesk-input.workspace = true
glidedesk-ipc.workspace = true
glidedesk-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading"] }

[features]
# Set by the release build: embeds the built UI instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
