[workspace]
resolver = "3"
members = ["crates/proto", "crates/layout", "crates/config", "crates/net", "crates/input", "crates/ipc", "crates/platform", "crates/clipboard", "crates/transfer", "crates/core", "crates/agent", "app", "xtask"]
default-members = ["crates/proto", "crates/layout", "crates/config", "crates/net", "crates/input", "crates/ipc", "crates/platform", "crates/clipboard", "crates/transfer", "crates/core", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Nexpingdesk"]

[workspace.dependencies]
nexpingdesk-proto = { path = "crates/proto" }
nexpingdesk-layout = { path = "crates/layout" }
nexpingdesk-config = { path = "crates/config" }
nexpingdesk-input = { path = "crates/input" }
nexpingdesk-net = { path = "crates/net" }
nexpingdesk-ipc = { path = "crates/ipc" }
nexpingdesk-platform = { path = "crates/platform" }
nexpingdesk-core = { path = "crates/core" }
nexpingdesk-clipboard = { path = "crates/clipboard" }
nexpingdesk-transfer = { path = "crates/transfer" }

anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["pure"] }
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
futures = "0.3.34"
getrandom = "0.4"
mdns-sd = "0.21"
netdev = "0.46"
postcard = { version = "1.1.3", features = ["use-std"] }
proptest = "1.11"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6"
tempfile = "3.27"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "fs", "process"] }
toml = "1.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zstd = "0.14"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
dbg_macro = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
incremental = false

# Tests should still be fast to build but not painfully slow to run.
[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 1
