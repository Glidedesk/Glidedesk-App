# Lint + tests on every push / pull request — one Linux runner (1× billing).
# Budget notes: PLAN §13.1 (GitHub Free private repos: 2,000 min/month).
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
    paths-ignore: ["**.md", "docs/**", "graphify-out/**", "signing/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "graphify-out/**", "signing/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  XWIN_ACCEPT_LICENSE: "1"
  XWIN_CROSS_COMPILER: clang
  # No debug info: CI only needs pass/fail. Halves target/ size (the runner's
  # 14 GB disk filled up during the Windows cross-check) and speeds up linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev clang lld llvm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-xwin

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: Build UI (embedded into the app)
        working-directory: app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (Linux)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast

      - name: Cache Windows SDK (xwin)
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-v1

      - name: Clippy (Windows x64 cross-check)
        run: cargo xwin clippy --workspace --exclude xtask --target x86_64-pc-windows-msvc --locked -- -D warnings
