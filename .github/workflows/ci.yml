# Tests on every pull request and every push to main, on GitHub's hosted runners
# (Linux, Windows and macOS natively). Only when every test job is green does a
# push to main (→ "Nightly" pre-release) or a v* tag (→ release) publish anything.
#
# Public-repo hardening:
#   - the token is read-only by default; only the release's publish job can write
#   - pull requests (also from forks) run with no secrets and can't publish
#   - every action is pinned to a full commit SHA (Dependabot keeps them current)
#   - caches are written only from main, so a pull request can't poison them
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: CI only needs pass/fail. Smaller target/, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    name: Linux x64 — lint, tests, real agents
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev xvfb x11-xserver-utils
          # Keyboard/mouse injection through uinput, like a desktop user in group "input".
          sudo chmod 666 /dev/uinput || true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Test jobs only: caches are saved from main alone (a pull request can't write them)
      # and the release builds use none, so nothing shipped comes from a cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest,cargo-deny

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: UI — typecheck, tests, build (embedded into the app)
        working-directory: app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Dependencies — advisories, licences, sources (deny.toml)
        run: cargo deny --locked check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast

      - name: Build the app
        run: cargo build -p glidedesk-app --locked

      - name: Real agents — connect, client restarts, self-test
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/dev/null 2>&1 &
          sleep 1
          DISPLAY=:99 bash scripts/os-smoke.sh target/debug/glidedesk

  native:
    name: ${{ matrix.name }} — tests, real agents
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # xtask (packaging) only runs on Linux: not built on Windows.
          - { name: Windows x64, os: windows-2025, exe: glidedesk.exe, skip: "--exclude xtask" }
          - { name: macOS ARM64, os: macos-15, exe: glidedesk, skip: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      # Test jobs only: caches are saved from main alone (a pull request can't write them)
      # and the release builds use none, so nothing shipped comes from a cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: Build UI (embedded into the app)
        working-directory: app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Clippy (native)
        run: cargo clippy --workspace ${{ matrix.skip }} --all-targets --locked -- -D warnings

      - name: Tests (native)
        # macOS: also the real event-tap tests (they take over the runner's input).
        env:
          GLIDEDESK_TAP_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
        run: cargo nextest run --workspace ${{ matrix.skip }} --locked --no-fail-fast

      - name: Build the app
        run: cargo build -p glidedesk-app --locked

      - name: Real agents — connect, client restarts, self-test
        env:
          EXE: target/debug/${{ matrix.exe }}
          NAME: ${{ matrix.name }}
        run: |
          set +e
          bash scripts/os-smoke.sh "$EXE"
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            # The runner refused keyboard/mouse access (can't be granted on CI): reported, not failed.
            echo "::warning title=$NAME::agents could not get keyboard/mouse access on this runner"
            exit 0
          fi
          exit "$code"

  # The one required status check for pull requests and the main branch.
  ok:
    name: CI passed
    needs: [linux, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every test job must have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  release:
    name: Release
    needs: [ok]
    # Only pushes to main and v* tags of this repository (never pull requests or forks).
    if: >-
      github.repository == 'soykot360/glidedesk' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No secrets are passed: the signing keys are secrets of the "release"
    # environment, which only main and v* tags may use.
    uses: ./.github/workflows/release.yml
