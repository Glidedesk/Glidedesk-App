# Nexpingdesk CI — the one pipeline.
#
#   pull request              → test (Linux, Windows, macOS natively)
#   Dependabot pull request   → test → auto-merge (patch/minor) → Nightly
#   push to main / manual run → test → build installers → "Nightly" pre-release
#   tag v*                    → test → build installers → release
#
# Nothing is built or published unless every test job passed ("CI passed", also
# the required check for merging into main).
#
# Hardening for a public repository:
#   - the token is read-only by default; only the publish job can write
#   - pull requests (also from forks) get no secrets and never reach the release jobs
#   - signing keys are secrets of the "release" environment, which only main and
#     v* tags can use; the repository itself has no secrets (a private repository
#     on GitHub Free has no environments: the same secrets are then set on it)
#   - every action is pinned to a full commit SHA (Dependabot keeps them current)
#   - test caches are saved from main only; release builds use no cache at all
#   - downloaded tools are pinned by version and SHA-256
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # ───────────────────────────── test ─────────────────────────────

  linux:
    name: Linux x64 — lint, tests, real agents
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # No debug info: tests only need pass/fail. Smaller target/, faster links.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev xvfb x11-xserver-utils
          # Keyboard/mouse injection through uinput, like a desktop user in group "input".
          sudo chmod 666 /dev/uinput || true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest,cargo-deny

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: UI — typecheck, tests, build (embedded into the app)
        working-directory: app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Dependencies — advisories, licences, sources (deny.toml)
        run: cargo deny --locked check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --locked --no-fail-fast

      - name: Build the app
        run: cargo build -p nexpingdesk-app --locked

      - name: Real agents — connect, client restarts, self-test
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/dev/null 2>&1 &
          sleep 1
          DISPLAY=:99 bash scripts/os-smoke.sh target/debug/nexpingdesk

  native:
    name: ${{ matrix.name }} — tests, real agents
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # xtask (packaging) only runs on Linux: not built on Windows.
          - { name: Windows x64, os: windows-2025, exe: nexpingdesk.exe, skip: "--exclude xtask" }
          - { name: macOS ARM64, os: macos-15, exe: nexpingdesk, skip: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: Build UI (embedded into the app)
        working-directory: app/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Clippy (native)
        run: cargo clippy --workspace ${{ matrix.skip }} --all-targets --locked -- -D warnings

      - name: Tests (native)
        # macOS: also the real event-tap tests (they take over the runner's input).
        env:
          NEXPINGDESK_TAP_TESTS: ${{ runner.os == 'macOS' && '1' || '' }}
        run: cargo nextest run --workspace ${{ matrix.skip }} --locked --no-fail-fast

      - name: Build the app
        run: cargo build -p nexpingdesk-app --locked

      - name: Real agents — connect, client restarts, self-test
        env:
          EXE: target/debug/${{ matrix.exe }}
          NAME: ${{ matrix.name }}
        run: |
          set +e
          bash scripts/os-smoke.sh "$EXE"
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            # The runner refused keyboard/mouse access (can't be granted on CI): reported, not failed.
            echo "::warning title=$NAME::agents could not get keyboard/mouse access on this runner"
            exit 0
          fi
          exit "$code"

  ok:
    name: CI passed
    needs: [linux, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every test job must have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # Dependabot patch/minor updates merge themselves once every test passed; major
  # updates wait for a maintainer. A merge made with the workflow token doesn't
  # trigger a push run, so the job starts the Nightly build on main itself.
  automerge:
    name: Auto-merge Dependabot update
    needs: [ok]
    # Numeric account id of Dependabot (a login can be spoofed); branch in this repo.
    # dependabot/fetch-metadata also refuses to run unless the actor is Dependabot.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.id == 49699333 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # merge the pull request
      pull-requests: write # merge the pull request
      actions: write # start the Nightly build on main
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge (patch and minor updates only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only the commit that was tested: refused if the branch moved since.
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$TESTED_SHA"
          gh workflow run ci.yml --ref main
      - name: Major update — left for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major version update — review and merge it by hand."

  # ──────────────── release (main and v* tags, after "CI passed") ────────────────

  package-windows:
    name: Package — Windows x64 (built on Linux)
    needs: [ok]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.repository.fork && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      XWIN_ACCEPT_LICENSE: "1"
      XWIN_CROSS_COMPILER: clang
      NEXPINGDESK_CACHE: ${{ github.workspace }}/.nd-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "NEXPINGDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm nsis osslsigncode
          echo "$GITHUB_WORKSPACE/docker/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-xwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Signing key (optional)
        env:
          PFX: ${{ secrets.NEXPINGDESK_WIN_PFX_BASE64 }}
          PW: ${{ secrets.NEXPINGDESK_SIGN_PASSWORD }}
        run: |
          if [ -n "$PFX" ]; then
            echo "$PFX" | base64 -d > "$RUNNER_TEMP/win.pfx"
            { echo "NEXPINGDESK_WIN_PFX=$RUNNER_TEMP/win.pfx"; echo "NEXPINGDESK_WIN_PFX_PASSWORD=$PW"; } >> "$GITHUB_ENV"
          else
            echo "::notice::No NEXPINGDESK_WIN_PFX_BASE64 secret — Windows files will be unsigned."
          fi
      - run: cargo xtask package windows
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/win.pfx"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  package-linux:
    name: Package — Linux ${{ matrix.arch }}
    needs: [ok]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.repository.fork && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, nfpm: x86_64, sha: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 }
          - { arch: arm64, runner: ubuntu-24.04-arm, nfpm: arm64, sha: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "NEXPINGDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Tools (nfpm pinned, checksum verified)
        env:
          ARCH: ${{ matrix.nfpm }}
          SHA: ${{ matrix.sha }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          f="nfpm_${NFPM_VERSION}_Linux_${ARCH}.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "$SHA  $RUNNER_TEMP/$f" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$f" -C /usr/local/bin nfpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: cargo xtask package linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  package-macos:
    name: Package — macOS Apple Silicon
    needs: [ok]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.repository.fork && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      # Not RCODESIGN_*: rcodesign reads those variables as its own settings.
      APPLE_CODESIGN_VERSION: 0.29.0
      APPLE_CODESIGN_SHA256: d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "NEXPINGDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: rcodesign (pinned, checksum verified)
        run: |
          f="apple-codesign-${APPLE_CODESIGN_VERSION}-macos-universal.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_VERSION}/$f"
          echo "$APPLE_CODESIGN_SHA256  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          sudo install -m 755 "$(find "$RUNNER_TEMP" -name rcodesign -type f | head -n1)" /usr/local/bin/rcodesign
          rcodesign --version
      - name: Signing identity (optional)
        env:
          P12: ${{ secrets.NEXPINGDESK_MAC_P12_BASE64 }}
          PW: ${{ secrets.NEXPINGDESK_SIGN_PASSWORD }}
        run: |
          if [ -n "$P12" ]; then
            echo "$P12" | base64 -d > "$RUNNER_TEMP/mac.p12"
            { echo "NEXPINGDESK_MAC_P12=$RUNNER_TEMP/mac.p12"; echo "NEXPINGDESK_MAC_P12_PASSWORD=$PW"; } >> "$GITHUB_ENV"
          else
            echo "::notice::No NEXPINGDESK_MAC_P12_BASE64 secret — the app gets an ad-hoc signature."
          fi
      - run: cargo xtask package macos
      - name: Remove the signing identity
        if: always()
        run: rm -f "$RUNNER_TEMP/mac.p12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [package-windows, package-linux, package-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build-provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output-build
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Checksums (+ minisign signature when the key is set)
        env:
          KEY: ${{ secrets.NEXPINGDESK_MINISIGN_KEY_BASE64 }}
        run: |
          sudo apt-get install -y -qq minisign
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/minisign.key"; export NEXPINGDESK_MINISIGN_KEY="$RUNNER_TEMP/minisign.key"; fi
          cp signing/*.cer signing/minisign.pub output-build/ 2>/dev/null || true
          cargo xtask checksums
          rm -f "$RUNNER_TEMP/minisign.key"
          ls -la output-build
      # Attestations need a public repository (or GitHub Enterprise): skipped while private.
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output-build/*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          verify="\`minisign -Vm SHA256SUMS -p minisign.pub\`"
          if [ "$PRIVATE" != true ]; then verify="\`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` and $verify"; fi
          if [ "$IS_TAG" = true ]; then
            gh release create "$GITHUB_REF_NAME" output-build/* --title "Nexpingdesk $GITHUB_REF_NAME" --generate-notes --verify-tag
          else
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly output-build/* --prerelease --target "$GITHUB_SHA" --title "Nightly" \
              --notes "Latest build of main (${GITHUB_SHA::7}): macOS Apple Silicon, Windows x64 (installer, offline installer, portable), Linux x64 and ARM64. Verify: $verify."
          fi
