# Builds installers and publishes them to GitHub Releases.
#   push to main   → macOS ARM64 + Windows x64 + Linux x64/ARM64 → "Nightly" pre-release (replaced each time)
#   tag v*         → the same → full release
#   manual run     → the same as a draft release (macOS optional)
# Everything that can run on Linux does (1× billing); only the macOS app needs the Mac
# runner (10×). Docs-only pushes don't build. See PLAN §13.1 for the budget.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "graphify-out/**"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build macOS (uses ~10× minutes)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  XWIN_ACCEPT_LICENSE: "1"
  XWIN_CROSS_COMPILER: clang
  GLIDEDESK_CACHE: ${{ github.workspace }}/.gd-cache
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  windows:
    name: Windows x64 (built on Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "GLIDEDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm nsis osslsigncode
          echo "$GITHUB_WORKSPACE/docker/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cargo-xwin
            .gd-cache/webview2
          key: windows-deps-v1
      - name: Signing key (optional)
        env:
          PFX: ${{ secrets.GLIDEDESK_WIN_PFX_BASE64 }}
          PW: ${{ secrets.GLIDEDESK_SIGN_PASSWORD }}
        run: |
          if [ -n "$PFX" ]; then
            echo "$PFX" | base64 -d > "$RUNNER_TEMP/win.pfx"
            { echo "GLIDEDESK_WIN_PFX=$RUNNER_TEMP/win.pfx"; echo "GLIDEDESK_WIN_PFX_PASSWORD=$PW"; } >> "$GITHUB_ENV"
          else
            echo "::notice::No GLIDEDESK_WIN_PFX_BASE64 secret — Windows files will be unsigned."
          fi
      - run: cargo xtask package windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "GLIDEDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          case "$(uname -m)" in x86_64) a=x86_64;; aarch64) a=arm64;; esac
          url="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | jq -r --arg a "$a" '.assets[].browser_download_url | select(test("Linux_" + $a + "\\.tar\\.gz$"))')"
          curl -fsSL "$url" | sudo tar -xz -C /usr/local/bin nfpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.arch }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - run: cargo xtask package linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    # Mac minutes cost 10× (≈120 billed min per build): built for every published
    # release — main (Nightly) and tags — and for manual runs when asked for.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "GLIDEDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - name: rcodesign (prebuilt)
        run: |
          url="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/indygreg/apple-platform-rs/releases \
            | jq -r '[.[] | select(.tag_name | startswith("apple-codesign/"))][0].assets[].browser_download_url | select(test("macos-universal\\.tar\\.gz$"))')"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP"
          sudo install -m 755 "$(find "$RUNNER_TEMP" -name rcodesign -type f | head -n1)" /usr/local/bin/rcodesign
          rcodesign --version
      - name: Signing identity (optional)
        env:
          P12: ${{ secrets.GLIDEDESK_MAC_P12_BASE64 }}
          PW: ${{ secrets.GLIDEDESK_SIGN_PASSWORD }}
        run: |
          if [ -n "$P12" ]; then
            echo "$P12" | base64 -d > "$RUNNER_TEMP/mac.p12"
            { echo "GLIDEDESK_MAC_P12=$RUNNER_TEMP/mac.p12"; echo "GLIDEDESK_MAC_P12_PASSWORD=$PW"; } >> "$GITHUB_ENV"
          else
            echo "::notice::No GLIDEDESK_MAC_P12_BASE64 secret — the app gets an ad-hoc signature."
          fi
      - run: cargo xtask package macos
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, linux, macos]
    # Run even when the macOS job was skipped (manual run without macOS).
    if: always() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result != 'failure' && needs.macos.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: output-build
          merge-multiple: true
      - name: Checksums (+ minisign signature when the key is set)
        env:
          KEY: ${{ secrets.GLIDEDESK_MINISIGN_KEY_BASE64 }}
        run: |
          sudo apt-get install -y -qq minisign
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/minisign.key"; export GLIDEDESK_MINISIGN_KEY="$RUNNER_TEMP/minisign.key"; fi
          cp signing/*.cer signing/minisign.pub output-build/ 2>/dev/null || true
          cargo xtask checksums
          ls -la output-build
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$IS_TAG" = true ]; then
            gh release create "$GITHUB_REF_NAME" output-build/* --title "Glidedesk $GITHUB_REF_NAME" --generate-notes --verify-tag
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release create "manual-${GITHUB_RUN_NUMBER}" output-build/* --draft --target "$GITHUB_SHA" \
              --title "Glidedesk manual build ${GITHUB_RUN_NUMBER}" --notes "Manual build of ${GITHUB_SHA::7}."
          else
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly output-build/* --prerelease --target "$GITHUB_SHA" --title "Nightly" \
              --notes "Latest build of main (${GITHUB_SHA::7}): macOS Apple Silicon, Windows x64, Linux x64 and ARM64."
          fi
