# Builds installers and publishes them to GitHub Releases. Never runs by itself:
# ci.yml calls it only after every test job passed, and only for pushes to main
# and v* tags of this repository — never for pull requests or forks.
#   push to main → macOS ARM64 + Windows x64 + Linux x64/ARM64 → "Nightly" pre-release (replaced each time)
#   tag v*       → the same → full release
#
# Signing keys live in the "release" environment, which only main and v* tags can
# use. Release builds use no caches, and downloaded tools are pinned by version and
# SHA-256, so what ships is built only from this commit. Every file gets a signed
# SLSA build-provenance attestation (`gh attestation verify <file> -R soykot360/glidedesk`).
name: Release

on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  XWIN_ACCEPT_LICENSE: "1"
  XWIN_CROSS_COMPILER: clang
  GLIDEDESK_CACHE: ${{ github.workspace }}/.gd-cache
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  NFPM_VERSION: 2.47.0
  RCODESIGN_VERSION: 0.29.0

jobs:
  windows:
    name: Windows x64 (built on Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "GLIDEDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm nsis osslsigncode
          echo "$GITHUB_WORKSPACE/docker/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-xwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Signing key (optional)
        env:
          PFX: ${{ secrets.GLIDEDESK_WIN_PFX_BASE64 }}
          PW: ${{ secrets.GLIDEDESK_SIGN_PASSWORD }}
        run: |
          if [ -n "$PFX" ]; then
            echo "$PFX" | base64 -d > "$RUNNER_TEMP/win.pfx"
            { echo "GLIDEDESK_WIN_PFX=$RUNNER_TEMP/win.pfx"; echo "GLIDEDESK_WIN_PFX_PASSWORD=$PW"; } >> "$GITHUB_ENV"
          else
            echo "::notice::No GLIDEDESK_WIN_PFX_BASE64 secret — Windows files will be unsigned."
          fi
      - run: cargo xtask package windows
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/win.pfx"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, nfpm: x86_64, sha: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 }
          - { arch: arm64, runner: ubuntu-24.04-arm, nfpm: arm64, sha: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "GLIDEDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Tools
        env:
          ARCH: ${{ matrix.nfpm }}
          SHA: ${{ matrix.sha }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          f="nfpm_${NFPM_VERSION}_Linux_${ARCH}.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "$SHA  $RUNNER_TEMP/$f" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$f" -C /usr/local/bin nfpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo xtask package linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          if [ "$IS_TAG" = true ]; then echo "GLIDEDESK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: rcodesign (pinned, checksum verified)
        run: |
          f="apple-codesign-${RCODESIGN_VERSION}-macos-universal.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/$f"
          echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          sudo install -m 755 "$(find "$RUNNER_TEMP" -name rcodesign -type f | head -n1)" /usr/local/bin/rcodesign
          rcodesign --version
      - name: Signing identity (optional)
        env:
          P12: ${{ secrets.GLIDEDESK_MAC_P12_BASE64 }}
          PW: ${{ secrets.GLIDEDESK_SIGN_PASSWORD }}
        run: |
          if [ -n "$P12" ]; then
            echo "$P12" | base64 -d > "$RUNNER_TEMP/mac.p12"
            { echo "GLIDEDESK_MAC_P12=$RUNNER_TEMP/mac.p12"; echo "GLIDEDESK_MAC_P12_PASSWORD=$PW"; } >> "$GITHUB_ENV"
          else
            echo "::notice::No GLIDEDESK_MAC_P12_BASE64 secret — the app gets an ad-hoc signature."
          fi
      - run: cargo xtask package macos
      - name: Remove the signing identity
        if: always()
        run: rm -f "$RUNNER_TEMP/mac.p12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: output-build/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output-build
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Checksums (+ minisign signature when the key is set)
        env:
          KEY: ${{ secrets.GLIDEDESK_MINISIGN_KEY_BASE64 }}
        run: |
          sudo apt-get install -y -qq minisign
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/minisign.key"; export GLIDEDESK_MINISIGN_KEY="$RUNNER_TEMP/minisign.key"; fi
          cp signing/*.cer signing/minisign.pub output-build/ 2>/dev/null || true
          cargo xtask checksums
          rm -f "$RUNNER_TEMP/minisign.key"
          ls -la output-build
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output-build/*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$IS_TAG" = true ]; then
            gh release create "$GITHUB_REF_NAME" output-build/* --title "Glidedesk $GITHUB_REF_NAME" --generate-notes --verify-tag
          else
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly output-build/* --prerelease --target "$GITHUB_SHA" --title "Nightly" \
              --notes "Latest build of main (${GITHUB_SHA::7}): macOS Apple Silicon, Windows x64 (installer + portable), Linux x64 and ARM64. Verify: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`."
          fi
