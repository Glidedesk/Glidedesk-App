# Weekly dependency updates, grouped so each ecosystem is one pull request.
# Every update runs the full CI (tests on Linux, Windows and macOS) before merging.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app/ui
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      ui:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday }
